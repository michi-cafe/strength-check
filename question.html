<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>強み診断</title><link rel="stylesheet" href="style.css"></head>
<body class="page-question"><div class="scale-frame"><main class="fixed-canvas"><div id="questionArea"></div><div class="action-wrap"><button class="main-button" id="resultBtn" onclick="location.href='result.html'" disabled></button></div></main></div>
<script>
const answers={};let totalQuestions=0;
function fit(){const c=document.querySelector('.fixed-canvas'),f=document.querySelector('.scale-frame'),bs=getComputedStyle(document.body),w=innerWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight),s=Math.min(1,w/800);c.style.transform=`scale(${s})`;f.style.height=`${c.scrollHeight*s}px`}
function selectScore(b){const c=b.closest('.question-card');c.querySelectorAll('.score-buttons button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[c.dataset.strength]={strength:c.dataset.strength,category:c.dataset.category,score:Number(b.textContent.trim())};sessionStorage.setItem('strengthAnswers',JSON.stringify(answers));updateProgress();const n=c.nextElementSibling;if(n?.classList.contains('question-card'))n.scrollIntoView({behavior:'smooth',block:'start'})}
function updateProgress(){const n=Object.keys(answers).length,b=document.getElementById('resultBtn');b.textContent='診断結果を見る';b.disabled=n<totalQuestions}
fetch('data/strength.csv').then(r=>r.text()).then(data=>{const rows=data.replace(/^\uFEFF/,'').trim().split(/\r?\n/).slice(1);totalQuestions=rows.length;document.getElementById('questionArea').innerHTML=rows.map((line,i)=>{const [strength,category,text]=line.split(',');return `<div class="question-card" data-strength="${strength}" data-category="${category}"><div class="question-number">Q${i+1} / ${rows.length}</div><p class="question-text">${text}</p><div class="score-buttons">${[1,2,3,4,5,6,7].map(n=>`<button onclick="selectScore(this)">${n}</button>`).join('')}</div><div class="score-labels"><span>← 全く当てはまらない</span><span>非常によく当てはまる →</span></div></div>`}).join('');updateProgress();fit()});
addEventListener('load',fit);addEventListener('resize',fit);
</script></body></html>
