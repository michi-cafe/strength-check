
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強み診断</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-index">

    <div class="index-scale-frame">
    <div class="container">

        <h1>強み診断</h1>

        <div class="description">
            <p>
                この診断では、強みを以下の6つの分野から分析します。
            </p>

            <p>
                全24問に回答すると、あなたの強みTOP5が表示されます。
            </p>

            <p>
                各質問に、自分がどのくらい当てはまるかを1～7点で回答してください。
            </p>
        </div>

        <div
            class="image-grid"
            id="categoryGrid"
        ></div>

        <div class="start-button">
            <button class="main-button" onclick="location.href='question.html'">
                診断を始める
            </button>
        </div>

    </div>
    </div>

    <script>
        fetch("data/category.csv")
            .then(response => response.text())
            .then(data => {

                const lines = data.trim().split(/\r?\n/);
                lines.slice(1).forEach(line => {

                    const [
                        category,
                        image,
                        color,
                        barColor,
                        text
                    ] = line.split(",");

                    document.getElementById("categoryGrid").innerHTML += `
                        <div
                            class="image-card"
                            style="background-color: ${color};"
                        >

                            <img
                                src="${image}"
                                alt="${category}"
                            >

                            <div class="category-text">

                                <h3>
                                    ${category}
                                </h3>

                                <p>
                                    ${text}
                                </p>

                            </div>

                        </div>
                    `;
        	});
    	    });

        function fitIndexPage() {
            const frame = document.querySelector(".index-scale-frame");
            const container = document.querySelector(".page-index .container");
            if (!frame || !container) return;

            const bodyStyle = getComputedStyle(document.body);
            const availableWidth = window.innerWidth
                - parseFloat(bodyStyle.paddingLeft)
                - parseFloat(bodyStyle.paddingRight);
            const scale = Math.min(1, availableWidth / 800);

            container.style.transform = `scale(${scale})`;
            frame.style.height = `${container.offsetHeight * scale}px`;
        }

        window.addEventListener("load", fitIndexPage);
        window.addEventListener("resize", fitIndexPage);

    </script>

</body>

</html>
