
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強み診断</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .description {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .image-card {
    	    border-radius: 10px;
    	    padding: 15px;
	    min-height:100px;
    	    display: flex;
   	    align-items: center;
    	    gap: 15px;
	}

	.category-text h3{
	    margin:0 0 10px 0;
	    font-size:26px;
	    font-weight:bold;
	}
	.category-text p{
	    margin:0;
	    line-height:1.5;
	}
	.category-text{
	    flex:1;
	    display:flex;
	    flex-direction:column;
	    justify-content:center;
	}

        .start-button {
            margin-top: 25px;
        }

        .start-button button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #222222;
            color: white;
            cursor: pointer;
        }

        .start-button button:hover {
            background-color: #43a047;
        }

        @media (max-width: 600px) {
            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>強み診断</h1>

        <div class="description">
            <p>
                この診断では、強みを以下の6つの分野から分析します。
            </p>

            <p>
                全24問に回答すると、あなたの強みTOP5が表示されます。
            </p>

            <p>
                各質問に、自分がどのくらい当てはまるかを1～7点で回答してください。
            </p>
        </div>

        <div
            class="image-grid"
            id="categoryGrid"
        ></div>

        <div class="start-button">
            <button class="main-button" onclick="location.href='question.html'">
                診断を始める
            </button>
        </div>

    </div>

    <script>
        fetch("data/category.csv")
            .then(response => response.text())
            .then(data => {

                const lines = data.trim().split(/\r?\n/);
                lines.slice(1).forEach(line => {

                    const [
                        category,
                        image,
                        color,
                        barColor,
                        text
                    ] = line.split(",");

                    document.getElementById("categoryGrid").innerHTML += `
                        <div
                            class="image-card"
                            style="background-color: ${color};"
                        >

                            <img
                                src="${image}"
                                alt="${category}"
                            >

                            <div class="category-text">

                                <h3>
                                    ${category}
                                </h3>

                                <p>
                                    ${text}
                                </p>

                            </div>

                        </div>
                    `;
        	});
    	    });

    </script>

</body>

</html>
