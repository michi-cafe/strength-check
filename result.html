<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断結果</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-result">
    <div class="result-scale-frame">
    <div class="result-scale-content">
    <div class="result-card">
        <h1>診断結果</h1>

        <h2>カテゴリ別結果</h2>
        <div id="categoryResult"></div>

        <!-- TOP5収めver -->
        <h2>あなたの強み TOP5</h2>
        <div class="top5-fit-frame">
            <div id="top5Result"></div>
        </div>

        <!-- 1ページ収めver 
        <h2>あなたの強み TOP5</h2>
        <div class="top5-fit-frame"></div>-->

        <div class="copy-button">
            <button
                id="copyBtn" class="main-button"
                type="button"
                onclick="copyForAI()"
            >
                AI診断用テキストをコピー
            </button>
        </div>
    </div>

    
    </div>
    </div>

    <script>
        let aiPromptText = "";

        const savedData =
            sessionStorage.getItem("strengthAnswers");

        if (savedData === null) {
            document.getElementById("categoryResult").innerHTML =
                "<p>回答データが見つかりません。診断ページから回答してください。</p>";

            document.getElementById("top5Result").innerHTML = "";

            document.getElementById("copyBtn").disabled = true;
        } else {
            const answers = JSON.parse(savedData);

            Promise.all([
                fetch("data/strength.csv")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(
                                "strength.csvを読み込めませんでした"
                            );
                        }

                        return response.text();
                    }),

                fetch("data/category.csv")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(
                                "category.csvを読み込めませんでした"
                            );
                        }

                        return response.text();
                    }),

                fetch("data/prompt.txt")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(
                                "prompt.txtを読み込めませんでした"
                            );
                        }

                        return response.text();
                    })
            ])
                .then(([
                    strengthData,
                    categoryData,
                    promptTemplate
                ]) => {
                    const categoryInfo = {};
                    const strengthInfo = {};
                    const categoryScores = {};
                    const categoryMax = {};

                    const categoryLines =
                        categoryData
                            .replace(/^\uFEFF/, "")
                            .trim()
                            .split(/\r?\n/);

                    categoryLines
                        .slice(1)
                        .forEach(line => {
                            const [
                                category,
                                image,
                                color,
                                barColor,
                                text
                            ] = line.split(",");

                            categoryInfo[category] = {
                                image:image,
                                color:color,
                                barColor:barColor,
                                text:text
                            };

                            categoryScores[category] = 0;
                            categoryMax[category] = 0;
                        });

                    const strengthLines =
                        strengthData
                            .replace(/^\uFEFF/, "")
                            .trim()
                            .split(/\r?\n/);

                    strengthLines
                        .slice(1)
                        .forEach(line => {
                            const [
                                strength,
                                category,
                                text,
                                description
                            ] = line.split(",");

                            strengthInfo[strength] = {
                                category:category,
                                text:text,
                                description:description
                            };

                            if (
                                categoryMax[category] !==
                                undefined
                            ) {
                                categoryMax[category] += 7;
                            }
                        });

                    Object.values(answers)
                        .forEach(answer => {
                            if (
                                categoryScores[
                                    answer.category
                                ] !== undefined
                            ) {
                                categoryScores[
                                    answer.category
                                ] += answer.score;
                            }
                        });

                    const categoryPercent = {};

                    Object.keys(categoryScores)
                        .forEach(category => {
                            const maxScore =
                                categoryMax[category];

                            if (maxScore === 0) {
                                categoryPercent[category] = 0;
                            } else {
                                categoryPercent[category] =
                                    categoryScores[category] /
                                    maxScore *
                                    100;
                            }
                        });

                    let categoryHtml = "";

                    Object.keys(categoryInfo)
                        .forEach(category => {
                            const percent =
                                Math.round(
                                    categoryPercent[category]
                                );

                            categoryHtml += `
                                <div class="category-block">
                                    <div class="category-layout">

                                        <img
                                            class="category-icon"
                                            src="${categoryInfo[category].image}"
                                            alt="${category}"
                                        >

                                        <div class="category-content">

                                            <div class="category-title-row">
                                                <div class="category-text">
                                                    ${category}：${categoryInfo[category].text}
                                                </div>

                                                <div class="category-percent">
                                                    ${percent}%
                                                </div>
                                            </div>

                                            <div class="bar-bg">
                                                <div
                                                    class="bar-fill"
                                                    style="
                                                        width:${percent}%;
                                                        background-color:${categoryInfo[category].barColor};
                                                    "
                                                ></div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                    document.getElementById(
                        "categoryResult"
                    ).innerHTML = categoryHtml;

                    const strengthRanking =
                        Object.values(answers);

                    strengthRanking.sort((a, b) => {
                        if (a.score !== b.score) {
                            return b.score - a.score;
                        }

                        if (
                            categoryPercent[a.category] !==
                            categoryPercent[b.category]
                        ) {
                            return (
                                categoryPercent[b.category] -
                                categoryPercent[a.category]
                            );
                        }

                        return a.strength.localeCompare(
                            b.strength,
                            "ja"
                        );
                    });

                    const top5 =
                        strengthRanking.slice(0, 5);

                    let top5Html = "";

                    top5.forEach((item, index) => {
                        top5Html += `
                            <div
                                class="strength-card"
                                style="
                                    background-color:${categoryInfo[item.category].color};
                                "
                            >
                                <img
                                    class="strength-image"
                                    src="${categoryInfo[item.category].image}"
                                    alt="${item.category}"
                                >

                                <div class="strength-text">
                                    <div class="strength-name">
                                        ${index + 1}位 ${item.strength}
                                    </div>

                                    <div class="strength-description">
                                        ${strengthInfo[item.strength].description}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById(
                        "top5Result"
                    ).innerHTML = top5Html;

                    let top5Text = "";

                    top5.forEach((item, index) => {
                        top5Text +=
                            (index + 1) +
                            "位 " +
                            item.strength +
                            "\n\n" +
                            strengthInfo[
                                item.strength
                            ].description +
                            "\n\n";
                    });

                    let categoryText = "";

                    Object.keys(categoryInfo)
                        .forEach(category => {
                            categoryText +=
                                category +
                                "：" +
                                Math.round(
                                    categoryPercent[category]
                                ) +
                                "%\n\n" +
                                categoryInfo[category].text +
                                "\n\n";
                        });

                    aiPromptText =
                        promptTemplate
                            .replace(
                                "{CATEGORY}",
                                categoryText
                            )
                            .replace(
                                "{TOP5}",
                                top5Text
                            );
                })
                .catch(error => {
                    console.error(error);

                    document.getElementById(
                        "categoryResult"
                    ).innerHTML =
                        "<p>診断データの読み込みに失敗しました。</p>";

                    document.getElementById(
                        "top5Result"
                    ).innerHTML = "";

                    document.getElementById(
                        "copyBtn"
                    ).disabled = true;
                });
        }

        function copyForAI() {
            if (aiPromptText === "") {
                alert(
                    "コピーする診断結果がまだ準備できていません。"
                );

                return;
            }

            navigator.clipboard
                .writeText(aiPromptText)
                .then(() => {
                    alert(
                        "AI診断用テキストをコピーしました"
                    );
                })
                .catch(error => {
                    console.error(error);

                    alert(
                        "テキストをコピーできませんでした"
                    );
                });
        }

        <!-- TOP5収めver -->
        function fitResultLikeIndex() {
            const frame = document.querySelector(".result-scale-frame");
            const content = document.querySelector(".result-scale-content");
            
            if (!frame || !content) return;
            
            const bs = getComputedStyle(document.body);
            
            const availableWidth =
                window.innerWidth
                - parseFloat(bs.paddingLeft)
                - parseFloat(bs.paddingRight);

            const scale = Math.min(
                1,
                availableWidth / 800
            );

            content.style.transform = `scale(${scale})`;

            frame.style.height =
                `${content.offsetHeight * scale}px`;
        }
        
        <!-- 1ページ収めver 
        function fitResultLikeIndex() {
            const frame = document.querySelector(".result-scale-frame");
            const content = document.querySelector(".result-scale-content");
            if (!frame || !content) return;
            const bs = getComputedStyle(document.body);
            const availableWidth = window.innerWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight);
            const availableHeight = window.innerHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
            const scaleX = availableWidth / 800;
            const scaleY = availableHeight / content.offsetHeight;
            const scale = Math.min(1, scaleX, scaleY);
            content.style.transform = `scale(${scale})`;
            frame.style.height = `${content.offsetHeight * scale}px`;
        }-->
        window.addEventListener("load", fitResultLikeIndex);
        window.addEventListener("resize", fitResultLikeIndex);
        setTimeout(fitResultLikeIndex, 300);
    </script>
</body>
</html>
