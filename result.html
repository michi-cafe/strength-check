<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>診断結果</title><link rel="stylesheet" href="style.css"></head>
<body class="page-result"><div class="scale-frame"><main class="fixed-canvas result-card"><h1>診断結果</h1><h2>カテゴリ別結果</h2><div id="categoryResult"></div><h2>あなたの強み TOP5</h2><div id="top5Result"></div><div class="action-wrap"><button class="main-button" id="copyBtn" onclick="copyForAI()">AI診断用テキストをコピー</button></div></main></div>
<script>
let aiPromptText='';
function fit(){const c=document.querySelector('.fixed-canvas'),f=document.querySelector('.scale-frame'),bs=getComputedStyle(document.body),w=innerWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight),h=innerHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom),sw=w/800,sh=h/c.scrollHeight,s=Math.min(1,sw,sh);c.style.transform=`scale(${s})`;f.style.height=`${c.scrollHeight*s}px`}
const saved=sessionStorage.getItem('strengthAnswers');
if(!saved){categoryResult.innerHTML='<p>回答データが見つかりません。診断ページから回答してください。</p>';copyBtn.disabled=true;fit()}else Promise.all([fetch('data/strength.csv').then(r=>{if(!r.ok)throw Error();return r.text()}),fetch('data/category.csv').then(r=>{if(!r.ok)throw Error();return r.text()}),fetch('data/prompt.txt').then(r=>{if(!r.ok)throw Error();return r.text()})]).then(([sd,cd,prompt])=>{const answers=JSON.parse(saved),ci={},si={},scores={},max={};cd.replace(/^\uFEFF/,'').trim().split(/\r?\n/).slice(1).forEach(l=>{const [category,image,color,barColor,text]=l.split(',');ci[category]={image,color,barColor,text};scores[category]=0;max[category]=0});sd.replace(/^\uFEFF/,'').trim().split(/\r?\n/).slice(1).forEach(l=>{const [strength,category,text,description]=l.split(',');si[strength]={category,text,description};if(max[category]!==undefined)max[category]+=7});Object.values(answers).forEach(a=>{if(scores[a.category]!==undefined)scores[a.category]+=a.score});const pct={};Object.keys(scores).forEach(c=>pct[c]=max[c]?scores[c]/max[c]*100:0);categoryResult.innerHTML=Object.keys(ci).map(c=>{const p=Math.round(pct[c]);return `<div class="category-block"><div class="category-layout"><img class="category-icon" src="${ci[c].image}" alt="${c}"><div class="category-content"><div class="category-title-row"><div>${c}：${ci[c].text}</div><div class="category-percent">${p}%</div></div><div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${ci[c].barColor}"></div></div></div></div></div>`}).join('');const top=Object.values(answers).sort((a,b)=>b.score-a.score||pct[b.category]-pct[a.category]||a.strength.localeCompare(b.strength,'ja')).slice(0,5);top5Result.innerHTML=top.map((x,i)=>`<div class="strength-card" style="background:${ci[x.category].color}"><img class="strength-image" src="${ci[x.category].image}" alt="${x.category}"><div><div class="strength-name">${i+1}位 ${x.strength}</div><div class="strength-description">${si[x.strength].description}</div></div></div>`).join('');let ct=Object.keys(ci).map(c=>`${c}：${Math.round(pct[c])}%\n\n${ci[c].text}`).join('\n\n');let tt=top.map((x,i)=>`${i+1}位 ${x.strength}\n\n${si[x.strength].description}`).join('\n\n');aiPromptText=prompt.replace('{CATEGORY}',ct).replace('{TOP5}',tt);requestAnimationFrame(()=>setTimeout(fit,50))}).catch(()=>{categoryResult.innerHTML='<p>診断データの読み込みに失敗しました。</p>';copyBtn.disabled=true;fit()});
function copyForAI(){if(!aiPromptText)return alert('コピーする診断結果がまだ準備できていません。');navigator.clipboard.writeText(aiPromptText).then(()=>alert('AI診断用テキストをコピーしました')).catch(()=>alert('テキストをコピーできませんでした'))}
addEventListener('load',fit);addEventListener('resize',fit);
</script></body></html>
